name: Deploy LLM Wiki to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download d3.js (embedded)
        run: |
          curl -sL -o /tmp/d3.v7.min.js \
            "https://d3js.org/d3.v7.min.js"
      - name: Install dependencies
        run: |
          python3 -m pip install markdown --quiet
      - name: Lint vault
        run: |
          python3 scripts/lint-vault.py
      - name: Build static site
        run: |
          python3 scripts/build-site.py
          python3 scripts/generate-graph.py
          cp vault-graph.html _site/vault-graph.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
