<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#111b30"/></linearGradient>
  <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d5dfc"/><stop offset="1" stop-color="#32c5ff"/></linearGradient>
  <filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".28"/></filter>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7590b5"/></marker>
  <style>
    text{font-family:'DejaVu Sans',Arial,sans-serif;fill:#eef5ff}.title{font-size:38px;font-weight:700}.sub{font-size:17px;fill:#9db0cc}.h{font-size:23px;font-weight:700}.k{font-size:15px;font-weight:700;letter-spacing:1.2px}.body{font-size:15px}.small{font-size:13px;fill:#b8c6da}.tiny{font-size:12px;fill:#9db0cc}.card{fill:#14233a;stroke:#2e496c;stroke-width:1.5}.line{stroke:#7590b5;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>
</defs>
<rect width="1600" height="1040" fill="url(#bg)"/>
<!-- header -->
<text x="70" y="66" class="title">СИНЕРГИЯ × ГЕЛИОС</text>
<text x="70" y="98" class="sub">C4-карта предприятия: от ландшафта холдинга до исполняемой нейрооперации</text>
<rect x="1280" y="43" width="250" height="52" rx="26" fill="#172840" stroke="#405d84"/>
<text x="1405" y="75" text-anchor="middle" class="body">Architecture as Code</text>

<!-- C1 -->
<rect x="55" y="135" width="1490" height="170" rx="24" class="card" filter="url(#shadow)"/>
<rect x="75" y="155" width="62" height="34" rx="17" fill="#4d7cff"/><text x="106" y="178" text-anchor="middle" class="k">C1</text>
<text x="155" y="181" class="h">ЛАНДШАФТ ХОЛДИНГА</text><text x="155" y="207" class="small">Зачем существует система и с кем она взаимодействует</text>
<g>
 <rect x="105" y="232" width="225" height="48" rx="12" fill="#203451"/><text x="217" y="261" text-anchor="middle" class="body">Президент / руководство</text>
 <rect x="390" y="232" width="225" height="48" rx="12" fill="#203451"/><text x="502" y="261" text-anchor="middle" class="body">Сотрудники и студенты</text>
 <rect x="675" y="218" width="250" height="70" rx="16" fill="url(#hero)"/><text x="800" y="248" text-anchor="middle" class="h">Холдинг «Синергия»</text><text x="800" y="271" text-anchor="middle" class="small" style="fill:#fff">5 894 чел. · 1 910 подразделений</text>
 <rect x="985" y="232" width="225" height="48" rx="12" fill="#203451"/><text x="1097" y="261" text-anchor="middle" class="body">Клиенты и партнёры</text>
 <rect x="1270" y="232" width="225" height="48" rx="12" fill="#203451"/><text x="1382" y="261" text-anchor="middle" class="body">Регуляторы / рынок</text>
</g>

<!-- connector --> <path d="M800 305 L800 334" class="line"/>
<!-- C2 -->
<rect x="55" y="335" width="1490" height="190" rx="24" class="card" filter="url(#shadow)"/>
<rect x="75" y="355" width="62" height="34" rx="17" fill="#16a6a1"/><text x="106" y="378" text-anchor="middle" class="k">C2</text>
<text x="155" y="381" class="h">БИЗНЕС-ДОМЕНЫ И ЦИФРОВЫЕ КОНТЕЙНЕРЫ</text><text x="155" y="407" class="small">Где живут процессы, данные и ответственность</text>
<g class="body">
 <rect x="105" y="438" width="185" height="58" rx="13" fill="#183d48" stroke="#258d92"/><text x="197" y="462" text-anchor="middle">Образование</text><text x="197" y="482" text-anchor="middle" class="tiny">LMS · контент · деканаты</text>
 <rect x="315" y="438" width="185" height="58" rx="13" fill="#183d48" stroke="#258d92"/><text x="407" y="462" text-anchor="middle">Продажи</text><text x="407" y="482" text-anchor="middle" class="tiny">CRM · телефония · лиды</text>
 <rect x="525" y="438" width="185" height="58" rx="13" fill="#183d48" stroke="#258d92"/><text x="617" y="462" text-anchor="middle">Маркетинг</text><text x="617" y="482" text-anchor="middle" class="tiny">трафик · аналитика</text>
 <rect x="735" y="428" width="220" height="78" rx="15" fill="#254167" stroke="#6d8dc2"/><text x="845" y="457" text-anchor="middle" font-size="17" font-weight="700">ГЕЛИОС</text><text x="845" y="480" text-anchor="middle" class="tiny">онтология · агенты · контроль</text><text x="845" y="497" text-anchor="middle" class="tiny">DocHub / GitLab</text>
 <rect x="980" y="438" width="185" height="58" rx="13" fill="#183d48" stroke="#258d92"/><text x="1072" y="462" text-anchor="middle">Операции / HR</text><text x="1072" y="482" text-anchor="middle" class="tiny">штатка · регламенты</text>
 <rect x="1190" y="438" width="185" height="58" rx="13" fill="#183d48" stroke="#258d92"/><text x="1282" y="462" text-anchor="middle">Финансы</text><text x="1282" y="482" text-anchor="middle" class="tiny">1С · P&amp;L · платежи</text>
 <rect x="1400" y="438" width="105" height="58" rx="13" fill="#183d48" stroke="#258d92"/><text x="1452" y="462" text-anchor="middle">DWH</text><text x="1452" y="482" text-anchor="middle" class="tiny">события</text>
</g>
<path d="M290 467 H735" stroke="#416587" stroke-width="1.5"/><path d="M955 467 H1400" stroke="#416587" stroke-width="1.5"/>

<path d="M800 525 L800 554" class="line"/>
<!-- C3 -->
<rect x="55" y="555" width="1490" height="220" rx="24" class="card" filter="url(#shadow)"/>
<rect x="75" y="575" width="62" height="34" rx="17" fill="#f09b3e"/><text x="106" y="598" text-anchor="middle" class="k">C3</text>
<text x="155" y="601" class="h">РОЛИ, АГЕНТЫ И MCP-ИНСТРУМЕНТЫ</text><text x="155" y="627" class="small">Кто выполняет работу, какими полномочиями и через какие интерфейсы</text>
<!-- lifecycle -->
<g>
 <rect x="105" y="662" width="190" height="82" rx="15" fill="#402b45" stroke="#a9639c"/><text x="200" y="691" text-anchor="middle" class="body">1. Intake-бот</text><text x="200" y="714" text-anchor="middle" class="tiny">боль · вход · выход · SLA</text>
 <path d="M295 703 H335" class="line"/>
 <rect x="335" y="662" width="190" height="82" rx="15" fill="#402b45" stroke="#a9639c"/><text x="430" y="691" text-anchor="middle" class="body">2. Agent Forge</text><text x="430" y="714" text-anchor="middle" class="tiny">манифест · prompt · C4-слот</text>
 <path d="M525 703 H565" class="line"/>
 <rect x="565" y="662" width="190" height="82" rx="15" fill="#402b45" stroke="#a9639c"/><text x="660" y="691" text-anchor="middle" class="body">3. Governance</text><text x="660" y="714" text-anchor="middle" class="tiny">security · owner · доступы</text>
 <path d="M755 703 H795" class="line"/>
 <rect x="795" y="652" width="210" height="102" rx="17" fill="url(#hero)"/><text x="900" y="682" text-anchor="middle" font-size="17" font-weight="700">4. Агент в слоте</text><text x="900" y="706" text-anchor="middle" class="tiny" style="fill:#fff">роль + память + MCP</text><text x="900" y="727" text-anchor="middle" class="tiny" style="fill:#fff">SLA + политика эскалации</text>
 <path d="M1005 703 H1045" class="line"/>
 <rect x="1045" y="662" width="190" height="82" rx="15" fill="#263b55" stroke="#6885aa"/><text x="1140" y="691" text-anchor="middle" class="body">5. Наблюдаемость</text><text x="1140" y="714" text-anchor="middle" class="tiny">качество · стоимость · риск</text>
 <path d="M1235 703 H1275" class="line"/>
 <rect x="1275" y="662" width="230" height="82" rx="15" fill="#263b55" stroke="#6885aa"/><text x="1390" y="691" text-anchor="middle" class="body">6. Executive Dashboard</text><text x="1390" y="714" text-anchor="middle" class="tiny">ROI · витрина · семантический зум</text>
</g>

<path d="M800 775 L800 804" class="line"/>
<!-- C4 -->
<rect x="55" y="805" width="1490" height="170" rx="24" class="card" filter="url(#shadow)"/>
<rect x="75" y="825" width="62" height="34" rx="17" fill="#e54f67"/><text x="106" y="848" text-anchor="middle" class="k">C4</text>
<text x="155" y="851" class="h">ИСПОЛНЯЕМАЯ ОПЕРАЦИЯ — HUMAN SLOT → NEURO SLOT</text><text x="155" y="877" class="small">Атомарный контракт, который можно измерить, согласовать, заменить и откатить</text>
<g>
 <rect x="105" y="906" width="170" height="44" rx="10" fill="#462938"/><text x="190" y="933" text-anchor="middle" class="body">Триггер / событие</text>
 <path d="M275 928 H315" class="line"/>
 <rect x="315" y="906" width="170" height="44" rx="10" fill="#462938"/><text x="400" y="933" text-anchor="middle" class="body">Входные данные</text>
 <path d="M485 928 H525" class="line"/>
 <rect x="525" y="896" width="220" height="64" rx="13" fill="#633247" stroke="#e56e82"/><text x="635" y="923" text-anchor="middle" class="body">Промпт + алгоритм</text><text x="635" y="945" text-anchor="middle" class="tiny">модель · память · guardrails</text>
 <path d="M745 928 H785" class="line"/>
 <rect x="785" y="896" width="220" height="64" rx="13" fill="#633247" stroke="#e56e82"/><text x="895" y="923" text-anchor="middle" class="body">MCP / API-действие</text><text x="895" y="945" text-anchor="middle" class="tiny">CRM · 1С · LMS · Telegram</text>
 <path d="M1005 928 H1045" class="line"/>
 <rect x="1045" y="906" width="170" height="44" rx="10" fill="#462938"/><text x="1130" y="933" text-anchor="middle" class="body">Результат / SLA</text>
 <path d="M1215 928 H1255" class="line"/>
 <rect x="1255" y="896" width="250" height="64" rx="13" fill="#24483e" stroke="#43aa86"/><text x="1380" y="923" text-anchor="middle" class="body">Метрики + аудит + rollback</text><text x="1380" y="945" text-anchor="middle" class="tiny">human-in-the-loop при риске</text>
</g>

<!-- footer -->
<text x="70" y="1012" class="tiny">Версия 0.1 · Первый визуальный каркас · Источник: оргструктура + концепция «Гелиос» в Baza</text>
<text x="1530" y="1012" text-anchor="end" class="tiny">Семантический зум: C1 → C2 → C3 → C4</text>
</svg>